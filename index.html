
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phrolova Watch Face</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'phrolova-red': '#880015',
              'phrolova-dark': '#1a0505',
              'phrolova-gold': '#d4af37',
              'phrolova-silver': '#e5e7eb',
            },
            fontFamily: {
              gothic: ['"Times New Roman"', 'Times', 'serif'],
              tech: ['"Courier New"', 'Courier', 'monospace'],
              cinzel: ['Cinzel', 'serif'],
              sans: ['Roboto', 'sans-serif'],
            },
            boxShadow: {
              'glow': '0 0 20px rgba(136, 0, 21, 0.6)',
              'inner-vignette': 'inset 0 0 80px rgba(0,0,0,0.9)',
            },
            keyframes: {
              slideUp: {
                '0%': { transform: 'translateY(100%)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            },
            animation: {
              'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            }
          },
        },
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Roboto:wght@300;400;500;700&family=Oswald:wght@400;500;700&display=swap');
      
      body {
        background-color: #050505;
        color: #e5e7eb;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "jszip": "https://aistudiocdn.com/jszip@3.10.1/dist/jszip.min.js",
    "file-saver": "https://aistudiocdn.com/file-saver@2.0.5/dist/FileSaver.min.js"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
